name: Стенды

# Те же проверки, что гоняет релиз, — на каждый push в main и по кнопке. Зачем отдельно от
# релиза: пока стенды запускались только кнопкой «Релиз», красный стенд узнавался в день
# выпуска — так упали предвыпусковые прогоны 26.9 (стенд установщика с константами прежнего
# выпуска, стенд без движка). Здесь ничего не публикуется и не пишется в
# репозиторий: только проверки. Шаги повторяют release.yml дословно — расхождение между ними
# означало бы «зелено здесь, красно там».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Взять SDK плагинов
        run: |
          set -eu
          # Плагины каркаса (plugins/) собираются инструментом s2p (lint --official, build), а стенды плагинов зовут
          # его же и заглушки хоста splify2-api: SDK лежит соседним каталогом, как steer.
          git clone -q --depth 1 https://github.com/splify2/plugin-sdk "$GITHUB_WORKSPACE/../plugin-sdk"
          ( cd "$GITHUB_WORKSPACE/../plugin-sdk" && sh build.sh )
          echo "PLUGIN_SDK=$GITHUB_WORKSPACE/../plugin-sdk" >> "$GITHUB_ENV"

      - name: Собрать ядро для стендов
        run: |
          set -eu
          # См. одноимённый шаг в release.yml: enginematch и srsmatch гоняют настоящий движок.
          git clone -q --depth 1 https://github.com/splify2/steer "$GITHUB_WORKSPACE/../steer"
          make -C "$GITHUB_WORKSPACE/../steer" all
          "$GITHUB_WORKSPACE/../steer/build/steer" --version

      - name: Стенды
        run: |
          set -eu
          sh tests/run.sh
