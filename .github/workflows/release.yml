name: Релиз

# Сборка и публикация по кнопке. От человека нужна одна вещь — номер версии.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например 26.9 или 1.2.5): только цифры и точки. Ставится в VERSION и в тег vВЕРСИЯ'
        required: true
        type: string
      prerelease:
        description: 'Черновик для проверки: пометить как pre-release'
        required: false
        default: false
        type: boolean
      andromeda:
        description: 'Версия Andromeda для семени (выпуск vВЕРСИЯ репозитория andromeda); пусто — последний выпуск'
        required: false
        default: ''
        type: string
      codename:
        description: 'Кодовое имя выпуска (например Andromeda). Попадёт в заголовок релиза: «26.9 Andromeda»'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверить формат версии
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          # Значение — через env, а не подстановкой в текст: кавычка во входных данных стала бы кодом.
          V="$INPUT_VERSION"
          # Версия попадает не только в имя пакета: build.sh штампует её в ?v= у бандлов и
          # в build-id.txt, по которому загрузчик решает, брать интерфейс из кеша браузера
          # или заново. Опечатка здесь — это «пакет обновился, интерфейс прежний».
          #
          # Числа, разделённые точками, не меньше двух — и число составляющих НЕ проверяется:
          # «26.9» — такая же законная версия, как «1.2.5». Прежний барьер требовал ровно
          # три части и отвергал собственный выпуск на первом шаге, хотя build.sh, install.sh,
          # бэкенд и интерфейс две части принимают. tests/pkgmatch.sh берёт выражение отсюда и
          # сверяет с ними, чтобы барьеры больше не расходились.
          echo "$V" | grep -qE '^[0-9]+(\.[0-9]+)+$' || {
            echo "::error::версия '$V' — не числа через точку (например 26.9 или 1.2.5)"; exit 1; }
          echo "$V" > VERSION
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Собрать заголовок релиза
        env:
          INPUT_CODENAME: ${{ inputs.codename }}
        run: |
          set -eu
          # Заголовок релиза — это то, что бэкенд (gh_load_api в m-engine.sh) отдаёт
          # интерфейсу как НАЗВАНИЕ выпуска рядом с версией: человек выбирает в списке
          # «26.9 Andromeda», а ставится пакет по версии. Без кодового имени заголовок
          # прежний — «splify2 26.9», как у всех выпусков до этого.
          #
          # Вертикальная черта в имени запрещена: ей размечен список названий в бэкенде
          # (GH_NAMES «версия=название|»), и такое название он молча заменит числом.
          C="$(printf '%s' "$INPUT_CODENAME" | sed 's/^[[:blank:]]*//; s/[[:blank:]]*$//')"
          case "$C" in *"|"*)
            echo "::error::кодовое имя '$C' содержит вертикальную черту — бэкенд её не примет"; exit 1 ;;
          esac
          if [ -n "$C" ]; then
            echo "RELEASE_NAME=$VERSION $C" >> "$GITHUB_ENV"
          else
            echo "RELEASE_NAME=splify2 $VERSION" >> "$GITHUB_ENV"
          fi

      - name: Список изменений
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eu
          # Что нового — раздел «## <версия>» из CHANGELOG.md (до следующего «## »): он идёт
          # первым в текст выпуска здесь и в splify2/releases, а оттуда — на страницу выпусков
          # сайта. Нет раздела — стабильный выпуск не выходит (выпуск без списка изменений
          # ничего не говорит человеку, который решает, обновляться ли); предварительный
          # выходит с предупреждением. Шаг стоит до сборки и до записи VERSION и ветки dist:
          # отказ здесь не оставляет полувыпуска.
          awk -v v="$VERSION" '
            /^## / { if (on) exit; split($0, h, " "); if (h[2] == v) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md"; then
            if [ "$PRERELEASE" = true ]; then
              echo "::warning::в CHANGELOG.md нет раздела «## $VERSION» — выпуск без списка изменений"
              : > "$RUNNER_TEMP/changes.md"
            else
              echo "::error::в CHANGELOG.md нет раздела «## $VERSION»"; exit 1
            fi
          fi

      # Семя пакета (плагины «из коробки» и Andromeda) подписано ключом роли plugins официальных репозиториев:
      # секрет S2P_KEY_PLUGINS (файл .sec от `s2p keygen`, решение владельца В8; plugin-sdk/docs/s2p.md). Без ключа
      # build.sh собрал бы семя без подписи с пометкой unsigned — выпуску это не годится, поэтому отказ здесь, до сборки.
      # Индекс splify2-core-plugins подписывает S2P_KEY_INDEX и публикует PLUGINS_TOKEN (только стабильный выпуск).
      - name: Ключи подписи
        env:
          S2P_KEY_PLUGINS: ${{ secrets.S2P_KEY_PLUGINS }}
          S2P_KEY_INDEX: ${{ secrets.S2P_KEY_INDEX }}
          PLUGINS_TOKEN: ${{ secrets.PLUGINS_TOKEN }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eu
          miss=""
          [ -n "$S2P_KEY_PLUGINS" ] || miss="$miss S2P_KEY_PLUGINS"
          if [ "$INPUT_PRERELEASE" != true ]; then
            [ -n "$S2P_KEY_INDEX" ] || miss="$miss S2P_KEY_INDEX"
            [ -n "$PLUGINS_TOKEN" ] || miss="$miss PLUGINS_TOKEN"
          fi
          [ -z "$miss" ] || { echo "::error::нет секретов:$miss — семя и индекс splify2-core-plugins подписываются только ключами splify2"; exit 1; }
          K="$RUNNER_TEMP/s2p-keys"
          mkdir -p "$K"
          ( umask 077; printf '%s\n' "$S2P_KEY_PLUGINS" > "$K/plugins.sec"
            [ -z "$S2P_KEY_INDEX" ] || printf '%s\n' "$S2P_KEY_INDEX" > "$K/index.sec" )
          # Открытый ключ — из закрытого (в закрытом ключе usign есть номер и ключ Ed25519): им проверяется семя и Andromeda.
          python3 - "$K/plugins.sec" "$K/plugins.pub" <<'PY'
          import base64, sys
          lines = [l for l in open(sys.argv[1]).read().splitlines() if l.strip()]
          raw = base64.b64decode(lines[-1])
          if len(raw) != 104 or raw[:4] != b"EdBK" or any(raw[4:8]):
              sys.exit("S2P_KEY_PLUGINS — не закрытый ключ usign без пароля")
          open(sys.argv[2], "w").write("untrusted comment: splify2 plugins key %s\n%s\n"
              % (raw[32:40].hex(), base64.b64encode(b"Ed" + raw[32:40] + raw[72:104]).decode()))
          PY
          { echo "S2P_KEY=$K/plugins.sec"; echo "S2P_KEYS=$K"; } >> "$GITHUB_ENV"

      - name: Взять SDK плагинов
        run: |
          set -eu
          # Плагины каркаса (plugins/) собираются инструментом s2p (lint --official, build), а стенды плагинов зовут
          # его же и заглушки хоста splify2-api: SDK лежит соседним каталогом, как steer.
          git clone -q --depth 1 https://github.com/splify2/plugin-sdk "$GITHUB_WORKSPACE/../plugin-sdk"
          ( cd "$GITHUB_WORKSPACE/../plugin-sdk" && sh build.sh )
          echo "PLUGIN_SDK=$GITHUB_WORKSPACE/../plugin-sdk" >> "$GITHUB_ENV"

      - name: Взять Andromeda
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ANDROMEDA: ${{ inputs.andromeda }}
        run: |
          set -eu
          # Интерфейс — плагин andromeda из своего репозитория: пакет несёт его в семени (/usr/share/splify2/seed) и
          # ставит при установке и обновлении. Берётся архив последнего выпуска плагина (`andromeda-<версия>-all.s2p`).
          # Подпись архива сверяется ключом plugins: неподписанный или чужой архив в семя не попадает.
          set -- --repo splify2/andromeda --pattern 'andromeda-*-all.s2p' --dir "$RUNNER_TEMP/andromeda"
          [ -z "$INPUT_ANDROMEDA" ] || set -- "v$INPUT_ANDROMEDA" "$@"
          gh release download "$@"
          a="$(ls "$RUNNER_TEMP"/andromeda/andromeda-*-all.s2p)"
          [ "$(printf '%s\n' "$a" | wc -l)" -eq 1 ] || { echo "::error::в выпуске andromeda не один архив: $a"; exit 1; }
          "$PLUGIN_SDK/bin/s2p" verify "$a" --pub "$S2P_KEYS/plugins.pub" >/dev/null || {
            echo "::error::$a не подписан ключом plugins"; exit 1; }
          echo "ANDROMEDA_S2P=$a" >> "$GITHUB_ENV"

      - name: Собрать ядро для стендов
        run: |
          set -eu
          # tests/enginematch.sh и tests/srsmatch.sh гоняют объект rpcd против НАСТОЯЩЕГО
          # движка из соседнего каталога (../steer/build/steer): спека, которую пишет интерфейс,
          # обязана пройти его разбор. Без движка они пропускаются вслух, то есть ничего не
          # проверяют. Базовая сборка движка — один gcc без mbedtls (цель all), репозиторий
          # публичный: клон без ключей, глубиной в один коммит.
          git clone -q --depth 1 https://github.com/splify2/steer "$GITHUB_WORKSPACE/../steer"
          make -C "$GITHUB_WORKSPACE/../steer" all
          "$GITHUB_WORKSPACE/../steer/build/steer" --version

      - name: Стенды
        run: |
          set -eu
          # Вариант «а» из splicicd#14: падение стенда гасит релиз. До этого шага
          # workflow прогонял только lint/tsc/check:cn, а npm test не вызывал вовсе —
          # и красный ui-harness (getByText нашёл два «Endpoint») доехал до четырёх
          # релизов подряд, потому что единственным способом узнать о нём был ручной
          # прогон. Цена решения известна и принята: стенд, покрасневший по чужой
          # причине (обновление vitest, сеть на runner'е), останавливает выпуск.
          #
          # Вход один — tests/run.sh, а не перечисление стендов здесь: список стендов
          # живёт в одном месте, иначе новый стенд появляется в репозитории и не
          # появляется в релизе. Пропуск ui-harness сам скрипт считает провалом, так
          # что «зелено» здесь означает, что интерфейс проверен, а не пропущен.
          # protomatch без quickjs пропускается вслух с кодом 0 — на runner'е его нет,
          # и это единственный стенд, для которого пропуск не провал.
          sh tests/run.sh

      - name: Собрать пакет
        run: ./build.sh 2>&1 | tee /tmp/build.log

      - name: Убедиться, что пакет собрался
        run: |
          set -eu
          ls -la out/
          # Оба формата обязательны. Пропустить один легко — сборка от этого не падает,
          # просто половина роутеров (OpenWrt 24.10 и старше, там opkg) остаётся без
          # пакета, и узнаётся это от людей, а не от барьера.
          test -f "out/splify2-${VERSION}-1_noarch.apk" || {
            echo "::error::пакет splify2-${VERSION}-1_noarch.apk не найден"; exit 1; }
          test -f "out/splify2-${VERSION}-1_all.ipk" || {
            echo "::error::пакет splify2-${VERSION}-1_all.ipk не найден"; exit 1; }
          # Семя: каждый архив подписан ключом plugins, пометки unsigned нет.
          [ ! -f build/pkg/usr/share/splify2/seed/unsigned ] || { echo "::error::семя собрано без подписи"; exit 1; }
          for f in build/seed/*.s2p; do
            "$PLUGIN_SDK/bin/s2p" verify "$f" --pub "$S2P_KEYS/plugins.pub" >/dev/null || {
              echo "::error::$f в семени не подписан ключом plugins"; exit 1; }
          done
          # ПЕРЕХОД С luci-app-splify2. Пакет переименован в splify2 (provides, replaces и conflicts прежнего имени —
          # build.sh), но обновление в 26.10.x ищет файл по прежнему имени (m-engine.sh: luci-app-splify2-<версия>-1_<noarch|all>
          # в version.json и ветке dist). Поэтому на переходе тот же пакет выкладывается ещё и копией под прежним именем:
          # имя файла менеджеру безразлично, ставится пакет splify2 и снимает прежний в той же транзакции. Отдельный
          # переходный пакет luci-app-splify2 не нужен — он остался бы стоять пустой записью в базе.
          mkdir -p out/compat
          cp "out/splify2-${VERSION}-1_noarch.apk" "out/compat/luci-app-splify2-${VERSION}-1_noarch.apk"
          cp "out/splify2-${VERSION}-1_all.ipk" "out/compat/luci-app-splify2-${VERSION}-1_all.ipk"

      - name: Зафиксировать версию в репозитории
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "Версия ${VERSION}"
            git push
          fi

      - name: Выложить пакеты в ветку dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST: dist
        run: |
          set -eu
          # ЗАЧЕМ ВТОРАЯ ВЫКЛАДКА, КОГДА ЕСТЬ РЕЛИЗ. splify2#15: провайдер закрывает не
          # GitHub, а `githubusercontent.com`, и закрывает целиком — `raw.`, `objects.` и
          # `release-assets.` стоят на одних адресах Fastly (185.199.108-111.133). Прямая
          # ссылка релиза перенаправляет как раз на `release-assets`, поэтому у такого
          # человека splify2 нельзя ни поставить, ни обновить. `codeload.github.com` живёт
          # на сети самого GitHub (140.82.121.x), отдаёт ветку архивом и никуда не
          # перенаправляет — install.sh и rpcd-объект берут пакеты оттуда, когда прямая
          # ссылка молчит.
          #
          # Ветка сиротская и переписывается каждым релизом: это канал выкладки, а не
          # история. Хранить в ней прошлые пакеты значило бы растить архив, который потом
          # целиком качает роутер ради одного файла.
          rm -rf /tmp/dist
          mkdir -p /tmp/dist
          cp "out/splify2-${VERSION}-1_noarch.apk" \
             "out/splify2-${VERSION}-1_all.ipk" \
             out/compat/*.apk out/compat/*.ipk \
             install.sh /tmp/dist/
          echo "$VERSION" > /tmp/dist/VERSION
          cd /tmp/dist
          git init -q -b "$DIST"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Пакеты ${VERSION}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$DIST:$DIST"

      - name: Текст выпуска
        # Один текст на два выпуска: этот файл идёт и в выпуск здесь, и в splify2/releases
        # (последний шаг). Выражения раскрываются в env, оболочка пишет его как есть.
        env:
          NOTES: |
            Интерфейс и управление для [ядра steer](https://github.com/splify2/steer). Нужно ядро
            steer 2.1.0 или новее (`steer-core`; протоколы ядро ставит плагинами само).

            Установка одной строкой — она же поставит ядро, если его нет:

            ```sh
            sh -c "$(wget -qO- https://gitlab.com/xyzmean/splify2/-/raw/main/install.sh)"
            ```

            Если `githubusercontent.com` у вас открыт, работает и так:

            ```sh
            sh -c "$(wget -qO- https://raw.githubusercontent.com/splify2/splify2/main/install.sh)"
            ```

            Если провайдер закрыл `githubusercontent.com`, файлы ниже не скачаются: прямая
            ссылка релиза ведёт на `release-assets.githubusercontent.com`. Те же пакеты
            лежат в ветке `dist` — на [зеркале](https://gitlab.com/xyzmean/splify2/-/tree/dist)
            и [здесь](https://github.com/splify2/splify2/tree/dist), — и первая команда берёт
            их оттуда сама.

            **Пакет теперь называется `splify2`** (был `luci-app-splify2`): он заменяет прежний
            сам. Панель Andromeda, языки, подписки, каталог списков, архив настроек и
            обновление — плагины: пакет несёт их подписанными и ставит при установке, без
            сети тоже. Файлы `luci-app-splify2-*` — тот же пакет под прежним именем, для
            кнопки обновления в splify2 26.10.

            Пакет один на все роутеры: архитектуры здесь нет, весь бинарный код в ядре steer.
            Форматов два: `.apk` для OpenWrt 25.12 и новее, `.ipk` для 24.10, 23.05 и
            всего, что осталось на opkg. Содержимое одинаковое.

            ```sh
            # OpenWrt 25.12+
            apk add --allow-untrusted ./splify2-${{ env.VERSION }}-1_noarch.apk
            # OpenWrt 24.10 и старше
            opkg install ./splify2-${{ env.VERSION }}-1_all.ipk
            ```
        run: |
          set -eu
          {
            if [ -s "$RUNNER_TEMP/changes.md" ]; then
              printf '## Что нового\n'
              cat "$RUNNER_TEMP/changes.md"
              printf '\n## Установка\n\n'
            fi
            printf '%s' "$NOTES"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            out/splify2-${{ env.VERSION }}-1_noarch.apk
            out/splify2-${{ env.VERSION }}-1_all.ipk
            out/compat/luci-app-splify2-${{ env.VERSION }}-1_noarch.apk
            out/compat/luci-app-splify2-${{ env.VERSION }}-1_all.ipk
            install.sh
          body_path: ${{ runner.temp }}/release-notes.md

      # Индекс splify2-core-plugins (splify2/splify2-core-plugins, ветка gh-pages; репозиторий подключает пакет —
      # files/etc/steer/plugins/repos.d/splify2-core-plugins.json): плагины семени этого выпуска, с Andromeda. Все —
      # «из коробки» (default) и подписаны ключом роли plugins. Предварительный выпуск в индекс не идёт.
      - name: Опубликовать плагины в splify2-core-plugins
        if: ${{ !inputs.prerelease }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PLUGINS_TOKEN }}
        run: |
          set -eu
          meta="$RUNNER_TEMP/core-meta.json"
          python3 - build/seed "$meta" <<'PY'
          import json, os, re, sys
          ids = sorted({re.sub(r"-[0-9][0-9.]*-[^-]+\.s2p$", "", f) for f in os.listdir(sys.argv[1]) if f.endswith(".s2p")})
          json.dump({"plugins": {i: {"default": True, "key_role": "plugins"} for i in ids}}, open(sys.argv[2], "w"))
          PY
          S2P="$PLUGIN_SDK/bin/s2p" INDEX_SLUG=splify2/splify2-core-plugins INDEX_ID=splify2-core-plugins \
            INDEX_NAME='splify2 core plugins' INDEX_KEY="$S2P_KEYS/index.sec" PUBS="$S2P_KEYS/plugins.pub" \
            ARCHIVES=build/seed META="$meta" sh "$PLUGIN_SDK/tools/publish-index.sh"

      # splify2/releases — version.json, списки изменений и копии пакетов всех проектов: по нему
      # установщик, роутер и сайт узнают о выпуске. Шаги последние: выпуск здесь к этому времени
      # уже вышел. Без секрета RELEASES_TOKEN (токен с правом записи в splify2/releases) они
      # пропускаются с предупреждением и выпуск не роняют.
      - name: Доступ к splify2/releases
        id: releases
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -n "$RELEASES_TOKEN" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::нет секрета RELEASES_TOKEN — выпуск не опубликован в splify2/releases"
          fi

      - name: Клон splify2/releases
        if: steps.releases.outputs.ok == '1'
        uses: actions/checkout@v4
        with:
          repository: splify2/releases
          token: ${{ secrets.RELEASES_TOKEN }}
          path: splify2-releases

      - name: Опубликовать в splify2/releases
        if: steps.releases.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eu
          # Ровно те файлы, что ушли в выпуск выше, и тот же текст.
          assets="$RUNNER_TEMP/release-assets"
          rm -rf "$assets"
          mkdir -p "$assets"
          cp "out/splify2-${VERSION}-1_noarch.apk" \
             "out/splify2-${VERSION}-1_all.ipk" \
             out/compat/*.apk out/compat/*.ipk \
             install.sh "$assets/"
          channel=stable
          [ "$PRERELEASE" = true ] && channel=prerelease
          cd splify2-releases
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python3 scripts/publish.py --product splify2 --version "$VERSION" --channel "$channel" \
            --name "$RELEASE_NAME" \
            --source-tag "v$VERSION" --changelog "$RUNNER_TEMP/release-notes.md" --assets "$assets" \
            --mirror "https://github.com/splify2/splify2/releases/download/v$VERSION"
