<!-- @dsCard group="Colors" viewport="700x150" name="Поверхности — тёмная" subtitle="Тот же набор ролей: data-theme='dark' переопределяет значения, не имена" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .sw { border-radius: 10px; height: 42px; }
  .lbl { font: var(--an-text-micro); color: var(--an-text-muted); margin-top: 6px; }
  .val { font: var(--an-text-micro); font-family: var(--an-font-mono); color: var(--an-text-muted); }
</style></head>
<body class="an-root" data-theme="dark">
<div class="row" style="gap:14px">
  <div style="flex:1"><div class="sw" style="background:var(--an-surface-page);border:1px solid var(--an-border)"></div><div class="lbl">page <span class="val">#121317</span></div></div>
  <div style="flex:1"><div class="sw" style="background:var(--an-surface-card);border:1px solid var(--an-border)"></div><div class="lbl">card <span class="val">#1b1d22</span></div></div>
  <div style="flex:1"><div class="sw" style="background:var(--an-surface-rail);border:1px solid var(--an-border)"></div><div class="lbl">rail <span class="val">#17181c</span></div></div>
  <div style="flex:1"><div class="sw" style="background:var(--an-surface-field);border:1px solid var(--an-border)"></div><div class="lbl">field <span class="val">#23252b</span></div></div>
  <div style="flex:1"><div class="sw" style="background:var(--an-border)"></div><div class="lbl">border <span class="val">#2a2c33</span></div></div>
</div>
</body></html>
