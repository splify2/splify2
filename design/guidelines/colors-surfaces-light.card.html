<!-- @dsCard group="Colors" viewport="700x150" name="Поверхности — светлая" subtitle="Страница, карточка, рельс, поле; карточку от фона отделяет линия, не тень" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .sw { border-radius: 10px; height: 42px; }
  .lbl { font: var(--an-text-micro); color: var(--an-text-muted); margin-top: 6px; }
  .val { font: var(--an-text-micro); font-family: var(--an-font-mono); color: var(--an-text-muted); }
</style></head>
<body class="an-root">
<div class="row" style="gap:14px">
  <div style="flex:1"><div class="sw" style="background:var(--an-surface-page);border:1px solid var(--an-border)"></div><div class="lbl">page <span class="val">#f6f7f9</span></div></div>
  <div style="flex:1"><div class="sw" style="background:var(--an-surface-card);border:1px solid var(--an-border)"></div><div class="lbl">card <span class="val">#ffffff</span></div></div>
  <div style="flex:1"><div class="sw" style="background:var(--an-surface-rail);border:1px solid var(--an-border)"></div><div class="lbl">rail <span class="val">#fbfbfd</span></div></div>
  <div style="flex:1"><div class="sw" style="background:var(--an-surface-field);border:1px solid var(--an-border)"></div><div class="lbl">field <span class="val">#f2f4f7</span></div></div>
  <div style="flex:1"><div class="sw" style="background:var(--an-border)"></div><div class="lbl">border <span class="val">#eceef3</span></div></div>
</div>
</body></html>
