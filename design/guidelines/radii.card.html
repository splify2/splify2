<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .sw { border-radius: 10px; height: 42px; }
  .lbl { font: var(--an-text-micro); color: var(--an-text-muted); margin-top: 6px; }
  .val { font: var(--an-text-micro); font-family: var(--an-font-mono); color: var(--an-text-muted); }
</style></head>
<body class="an-root">
<div class="row" style="gap:14px">
  <div style="flex:1"><div style="height:52px;border:1px solid var(--an-border);background:var(--an-surface-field);border-radius:16px"></div><div class="lbl">--an-radius-card <span class="val">16px</span></div></div><div style="flex:1"><div style="height:52px;border:1px solid var(--an-border);background:var(--an-surface-field);border-radius:12px"></div><div class="lbl">--an-radius-block <span class="val">12px</span></div></div><div style="flex:1"><div style="height:52px;border:1px solid var(--an-border);background:var(--an-surface-field);border-radius:10px"></div><div class="lbl">--an-radius-control <span class="val">10px</span></div></div><div style="flex:1"><div style="height:52px;border:1px solid var(--an-border);background:var(--an-surface-field);border-radius:9px"></div><div class="lbl">--an-radius-inner <span class="val">9px</span></div></div><div style="flex:1"><div style="height:52px;border:1px solid var(--an-border);background:var(--an-surface-field);border-radius:6px"></div><div class="lbl">--an-radius-badge <span class="val">6px</span></div></div>
  <div style="flex:1"><div style="height:52px;border:1px solid var(--an-border);background:var(--an-surface-field);border-radius:9999px"></div><div class="lbl">--an-radius-pill</div></div>
</div>
</body></html>
